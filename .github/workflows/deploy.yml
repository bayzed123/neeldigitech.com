name: Deploy

# Production only. The github-pages environment refuses deployments from any
# branch but the default one, so running this on a feature branch produced a
# guaranteed red X before a single step executed. Feature branches get CI.
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Pages deployment needs these; everything else is read-only.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race on the same D1 database.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: Worker API
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.bootstrap.outputs.api_url }}
    env:
      # Repository secrets are named CLOUD_FLARE_*; wrangler reads the
      # CLOUDFLARE_* spellings, so both are exported from the same source and
      # neither value is ever echoed.
      CLOUD_FLARE_API: ${{ secrets.CLOUD_FLARE_API }}
      CLOUD_FLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUD_FLARE_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUD_FLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Creates D1 / R2 / KV on the first run, reuses them afterwards, and
      # writes the resolved IDs into worker/wrangler.toml.
      - name: Provision Cloudflare resources
        id: bootstrap
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
        run: node scripts/bootstrap-cf.mjs

      - name: Apply D1 migrations
        working-directory: worker
        run: npx wrangler d1 migrations apply neeldigitech-db --remote

      - name: Deploy Worker
        working-directory: worker
        run: npx wrangler deploy

      - name: Ensure Worker secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Steadfast courier. Optional: unset simply leaves the courier panel
          # reporting itself as not connected.
          # Both spellings accepted. The repository happens to hold the
          # STEAT_FAST_* pair; reading either avoids a rename that would only
          # exist to satisfy this file, and mirrors how CLOUD_FLARE_API is read.
          STEADFAST_API_KEY: ${{ secrets.STEADFAST_API_KEY || secrets.STEAT_FAST_API }}
          STEADFAST_SECRET_KEY: ${{ secrets.STEADFAST_SECRET_KEY || secrets.STEAT_FAST_SECRET_KEY }}
          # Only needed for the push-based webhook. Without it the shop polls
          # instead, which works — updates just arrive on refresh, not instantly.
          # Same either-spelling reasoning as the pair above.
          STEADFAST_WEBHOOK_TOKEN: ${{ secrets.STEADFAST_WEBHOOK_TOKEN || secrets.STEAT_FAST_WEBHOOK_TOKEN }}
          # The Google service-account JSON key, pasted whole as one repository
          # secret. Optional: unset leaves the Analytics panel reporting itself
          # as not connected, same as an unset courier key.
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # Gemini keys are passed only to the Worker provisioning step and are
          # never bundled into the storefront. A single GEMINI_API_KEY may be
          # shared across features, or separate feature-specific secrets may be
          # supplied for independent quotas.
          ADMIN_GEMINI_API_KEY: ${{ secrets.ADMIN_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          SUPPORT_GEMINI_API_KEY: ${{ secrets.SUPPORT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          ALERT_GEMINI_API_KEY: ${{ secrets.ALERT_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          DEVLOPER_REPORT_GEMENI: ${{ secrets.DEVLOPER_REPORT_GEMENI || secrets.GEMINI_API_KEY }}
          # Optional fallback provider for server-side AI features.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Secret path segment for the weekly dev report's manual GitHub
          # Actions trigger. Optional: unset just means that trigger button
          # 404s and the report still runs on its Monday cron / Run now.
          DEV_REPORT_TRIGGER_TOKEN: ${{ secrets.DEV_REPORT_TRIGGER_TOKEN }}
          # Sends the new-order alert email (worker/src/lib/email.ts).
          # Optional: unset just means no email goes out on checkout.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/provision-secrets.mjs

      - name: Provision the dashboard owner
        env:
          D1_DATABASE_ID: ${{ steps.bootstrap.outputs.database_id }}
          # Prefer the variable: a username is not sensitive, and storing one
          # as a secret makes Actions redact that word everywhere it appears —
          # including inside the API URL, which then cannot cross job boundaries.
          ADMIN_USERNAME: ${{ vars.ADMIN_USERNAME || secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_NAME: ${{ vars.ADMIN_NAME }}
        run: node scripts/create-admin.mjs

      # Never fails the job. The Worker is already deployed by this point; a
      # freshly registered workers.dev subdomain can take several minutes to
      # get its TLS certificate (curl reports a handshake failure until then),
      # and blocking the storefront on that would be wrong.
      - name: Smoke test the deployment
        run: |
          URL="${{ steps.bootstrap.outputs.api_url }}"
          if [ -z "$URL" ]; then echo "No API URL resolved — skipping"; exit 0; fi

          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 "$URL/health" > /tmp/health.json 2>/dev/null; then
              echo "API is live:"; cat /tmp/health.json; echo; exit 0
            fi
            echo "waiting for the Worker and its certificate ($i/12)…"
            sleep 15
          done

          echo "::warning::$URL has not answered /health yet. On a newly registered workers.dev subdomain this is normal — the TLS certificate can take several minutes to issue, and curl reports an SSL handshake failure until it does. The Worker itself deployed successfully. Check $URL/health in a few minutes; if it is still failing, re-run this workflow."
          exit 0

  web:
    name: Storefront
    needs: api
    runs-on: ubuntu-latest
    # Belt and braces: Pages only accepts the default branch anyway.
    if: always() && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # A custom domain serves from the root, a project Pages site from
      # /<repo>/, and the router's basename follows Vite's base — get this
      # wrong and every asset 404s. Read the domain GitHub already has
      # configured rather than relying on a variable being kept in sync.
      - name: Resolve the Pages domain
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          # The temporary preview must remain on the repository Pages path.
          # A custom domain is used only when the user explicitly sets
          # CUSTOM_DOMAIN later, after preview verification is complete.
          DOMAIN="$CUSTOM_DOMAIN"
          if [ -n "$DOMAIN" ]; then
            echo "Publishing to https://$DOMAIN (base /)"
            echo "domain=$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
          else
            echo "No custom domain — publishing to the project Pages path"
            echo "domain=" >> "$GITHUB_OUTPUT"
            echo "base=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VITE_BASE: ${{ steps.site.outputs.base }}
          VITE_API_BASE: ${{ needs.api.outputs.api_url || vars.API_BASE_URL || 'https://neeldigitech.neelsarker15.workers.dev' }}
        run: |
          if [ -z "$VITE_API_BASE" ]; then
            echo "::warning::No API address was resolved; using the temporary Worker preview address. The storefront will publish, but product data will appear after the Worker is deployed."
            export VITE_API_BASE="https://neeldigitech.neelsarker15.workers.dev"
          fi
          npm run build --workspace web

      - name: Prepare Pages artifact
        env:
          CUSTOM_DOMAIN: ${{ steps.site.outputs.domain }}
        run: |
          # Pages serves 404.html for unknown paths; handing it the SPA shell
          # makes client-side routes survive a hard refresh.
          cp web/dist/index.html web/dist/404.html
          touch web/dist/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > web/dist/CNAME; fi

      # Generate the data-backed sitemap only after the API job succeeds. The
      # temporary Pages preview must still publish its storefront shell while
      # backend provisioning is being repaired.
      - name: Generate sitemap
        if: needs.api.result == 'success'
        env:
          VITE_API_BASE: ${{ needs.api.outputs.api_url || vars.API_BASE_URL || 'https://neeldigitech.neelsarker15.workers.dev' }}
          CUSTOM_DOMAIN: ${{ steps.site.outputs.domain }}
          PAGES_BASE: ${{ steps.site.outputs.base }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            SITE_URL="https://$CUSTOM_DOMAIN"
          else
            SITE_URL="https://${{ github.repository_owner }}.github.io${PAGES_BASE%/}"
          fi
          echo "Site URL for sitemap: $SITE_URL"
          SITE_URL="$SITE_URL" node scripts/generate-sitemap.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: pages
        uses: actions/deploy-pages@v4